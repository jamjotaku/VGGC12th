<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景角丸スクエア -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>

  <!-- 内側のカード風白いコンテナ -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="#ffffff" filter="url(#shadow)"/>

  <!-- ショッピングカート & チェックマークのグラフィック -->
  <g transform="translate(116, 100)">
    <!-- カート本体 -->
    <path d="M40 60 H80 L120 220 H240 L270 110 H100" fill="none" stroke="#2563eb" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 車輪 -->
    <circle cx="140" cy="255" r="20" fill="#ec4899"/>
    <circle cx="225" cy="255" r="20" fill="#ec4899"/>
    <!-- チェックマーク -->
    <path d="M140 130 L175 165 L245 95" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- テキスト：VGGC 12th -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="2">
    VGGC 12th
  </text>
</svg>
