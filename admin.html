<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGGC 12th - 管理者画面</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
  <div id="app" class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden" v-cloak>
    
    <!-- ヘッダー -->
    <div class="bg-gray-800 text-white p-6 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold">VGGC 12th 管理画面 (タグ・お品書き設定)</h1>
      <button v-if="user" @click="signOut" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition">ログアウト</button>
    </div>

    <!-- ログイン前 -->
    <div v-if="!user" class="p-8 max-w-md mx-auto my-10 bg-gray-50 rounded-xl border">
      <h2 class="font-bold text-lg mb-4 text-center">管理者ログイン</h2>
      <div v-if="authError" class="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm">{{ authError }}</div>
      <form @submit.prevent="handleAuth" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">管理者ID (admin固定)</label>
          <input type="text" v-model="authId" readonly class="w-full px-4 py-2 bg-gray-200 border rounded cursor-not-allowed text-gray-600 font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">パスワード</label>
          <input type="password" v-model="authPassword" required minlength="6" class="w-full px-4 py-2 bg-white border rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" @click="authMode = 'login'" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">ログイン</button>
          <button type="submit" @click="authMode = 'register'" class="flex-1 bg-white border border-gray-300 text-gray-700 py-2 rounded font-bold hover:bg-gray-50">初回登録</button>
        </div>
      </form>
    </div>

    <!-- ログイン後 (管理コンテンツ) -->
    <div v-else class="p-6">
      <div v-if="loading" class="text-center py-10 text-gray-500 font-bold animate-pulse">
        データを読み込み中...
      </div>
      
      <div v-else>
        <!-- コントロールバー -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-4">
          <input type="text" v-model="searchQuery" placeholder="サークル名、スペース名で検索..." 
                 class="w-full md:w-1/3 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <div class="text-sm text-gray-500 font-bold">
            全 {{ filteredCircles.length }} サークル
          </div>
        </div>

        <!-- サークル一覧テーブル -->
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left border border-gray-200">
            <thead class="bg-gray-100 text-gray-700">
              <tr>
                <th class="p-3 border-b border-r w-24">配置</th>
                <th class="p-3 border-b border-r w-48">サークル名</th>
                <th class="p-3 border-b border-r min-w-[200px]">タグ (カンマ区切り)</th>
                <th class="p-3 border-b border-r min-w-[300px]">お品書き(X) URL</th>
                <th class="p-3 border-b text-center w-24">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="circle in filteredCircles" :key="circle.circle_id" class="border-b hover:bg-blue-50/30 transition-colors">
                <td class="p-3 border-r font-bold text-gray-600 text-center">
                  {{ circle.space_sym }}-{{ circle.space_num }}
                </td>
                <td class="p-3 border-r font-bold">
                  {{ circle.circle_name }}
                  <div class="text-[10px] text-gray-500 font-normal mt-0.5">@{{ circle.twitter_id }}</div>
                </td>
                <td class="p-3 border-r">
                  <input type="text" v-model="editData[circle.circle_id].tagsInput" placeholder="イラスト本, アクスタ, 新刊セット" 
                         class="w-full px-2 py-1.5 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                  <div class="text-[10px] text-gray-400 mt-1">※カンマ(,)で区切ると複数バッジになります</div>
                </td>
                <td class="p-3 border-r">
                  <input type="text" v-model="editData[circle.circle_id].url" placeholder="https://x.com/..." 
                         class="w-full px-2 py-1.5 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </td>
                <td class="p-3 text-center">
                  <button @click="saveCircle(circle.circle_id)" 
                          class="bg-blue-600 text-white px-4 py-1.5 rounded font-bold hover:bg-blue-700 active:scale-95 transition-transform flex items-center justify-center gap-1 w-full"
                          :class="{'bg-green-600 hover:bg-green-700': saveStatus[circle.circle_id] === 'saved'}">
                    <svg v-if="saveStatus[circle.circle_id] === 'saved'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    {{ saveStatus[circle.circle_id] === 'saved' ? '保存済' : '保存' }}
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div v-if="filteredCircles.length === 0" class="text-center py-10 text-gray-500 font-bold">
          該当するサークルがありません
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const supabaseUrl = 'https://lgcwzlzrovdcjaywvmdk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnY3d6bHpyb3ZkY2pheXd2bWRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMjA1NzksImV4cCI6MjEwNDY5NjU3OX0.-axEWTfGBNrtt2POQn7VgkCSCgQH2v3Wn2SIQSgvKYo';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    createApp({
      setup() {
        const user = ref(null);
        const authId = ref('admin'); // IDはadmin固定
        const authPassword = ref('');
        const authMode = ref('login');
        const authError = ref('');
        
        const loading = ref(true);
        const circles = ref([]);
        const editData = ref({});
        const saveStatus = ref({}); // 各サークルの保存状態 ('saved' | null)
        const searchQuery = ref('');

        onMounted(async () => {
          const { data: { session } } = await supabaseClient.auth.getSession();
          user.value = session?.user || null;
          
          if (user.value) {
            await loadData();
          }

          supabaseClient.auth.onAuthStateChange((event, session) => {
            user.value = session?.user || null;
            if (user.value) loadData();
          });
        });

        const handleAuth = async () => {
          authError.value = '';
          const dummyEmail = 'admin@vggc.dummy.local';
          try {
            if (authMode.value === 'register') {
              const { error } = await supabaseClient.auth.signUp({ email: dummyEmail, password: authPassword.value });
              if (error) throw error;
              alert('管理者アカウントを作成しました。');
            } else {
              const { error } = await supabaseClient.auth.signInWithPassword({ email: dummyEmail, password: authPassword.value });
              if (error) throw error;
            }
          } catch (err) {
            authError.value = err.message === 'Invalid login credentials' ? 'パスワードが間違っています。' : err.message;
          }
        };

        const signOut = async () => {
          await supabaseClient.auth.signOut();
          circles.value = [];
          editData.value = {};
        };

        const loadData = async () => {
          loading.value = true;
          try {
            // 1. data.json からサークル一覧を取得
            const res = await fetch('data.json');
            const data = await res.json();
            circles.value = data.circles;

            // 2. 編集用データを初期化
            const initialEditData = {};
            circles.value.forEach(c => {
              initialEditData[c.circle_id] = { tagsInput: '', url: '' };
            });

            // 3. Supabase から登録済みのタグ・URLを取得してマージ
            const { data: dbData, error } = await supabaseClient.from('circle_info').select('*');
            if (!error && dbData) {
              dbData.forEach(info => {
                if (initialEditData[info.circle_id]) {
                  initialEditData[info.circle_id].tagsInput = (info.tags || []).join(', ');
                  initialEditData[info.circle_id].url = info.oshinagaki_url || '';
                }
              });
            }
            editData.value = initialEditData;
          } catch (error) {
            console.error('Data loading error:', error);
            alert('データの読み込みに失敗しました。');
          } finally {
            loading.value = false;
          }
        };

        const filteredCircles = computed(() => {
          if (!searchQuery.value) return circles.value;
          const q = searchQuery.value.toLowerCase();
          return circles.value.filter(c => 
            (c.circle_name && c.circle_name.toLowerCase().includes(q)) ||
            (c.space_sym && c.space_sym.toLowerCase().includes(q)) ||
            (c.penname && c.penname.toLowerCase().includes(q))
          );
        });

        const saveCircle = async (circleId) => {
          const input = editData.value[circleId];
          // カンマ区切りの文字列を配列に変換（空の要素は除外）
          const tagsArray = input.tagsInput.split(',').map(s => s.trim()).filter(s => s.length > 0);
          
          try {
            const { error } = await supabaseClient.from('circle_info').upsert({
              circle_id: circleId,
              tags: tagsArray,
              oshinagaki_url: input.url.trim() || null,
              updated_at: new Date().toISOString()
            });

            if (error) {
              // RLSエラーなど
              if (error.code === '42501') {
                throw new Error('保存権限がありません。管理者としてログインしているか確認してください。');
              }
              throw error;
            }

            // 保存成功エフェクト
            saveStatus.value[circleId] = 'saved';
            setTimeout(() => { saveStatus.value[circleId] = null; }, 2000);

          } catch (err) {
            console.error(err);
            alert('保存エラー: ' + err.message);
          }
        };

        return {
          user, authId, authPassword, authMode, authError, handleAuth, signOut,
          loading, circles, editData, saveStatus, searchQuery, filteredCircles,
          saveCircle
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
