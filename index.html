<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGGC 12th サークルリスト & 会場マップ</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
    .map-container {
      position: relative;
      width: 100%;
      overflow: auto;
      border: 1px solid #ccc;
    }
    .map-image {
      min-width: 800px; /* To allow scrolling on mobile */
      width: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app" class="container mx-auto p-4 flex flex-col md:flex-row gap-6">
    
    <!-- 左側：マップ -->
    <div class="w-full md:w-1/2 flex flex-col">
      <h1 class="text-2xl font-bold mb-4">VGGC 12th 会場マップ</h1>
      <div class="map-container bg-white rounded shadow p-2 mb-4">
        <p class="text-sm text-gray-500 mb-2">※ 以下の画像エリアに会場マップの画像（map.png等）を設定してください。ピンチアウトで拡大できます。</p>
        <!-- ユーザーがアップロードするであろう画像。現状はダミーまたはプレースホルダ -->
        <img src="map.jpg" alt="会場マップ" class="map-image" onerror="this.onerror=null; this.src='https://via.placeholder.com/1200x800.png?text=Please+Place+map.jpg+Here';">
      </div>
      <div class="bg-white rounded shadow p-4">
        <h2 class="text-lg font-bold mb-2">配置ブロック</h2>
        <div class="flex flex-wrap gap-2">
          <button v-for="block in blocks" :key="block" @click="filterBlock = block"
                  :class="['px-3 py-1 rounded text-sm font-bold', filterBlock === block ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300']">
            {{ block }}
          </button>
          <button @click="filterBlock = ''" class="px-3 py-1 rounded text-sm font-bold bg-red-100 text-red-600 hover:bg-red-200">
            クリア
          </button>
        </div>
      </div>
    </div>

    <!-- 右側：リスト -->
    <div class="w-full md:w-1/2 flex flex-col h-screen md:h-auto overflow-hidden">
      <h1 class="text-2xl font-bold mb-4">サークルリスト</h1>
      
      <!-- 検索バー -->
      <div class="mb-4">
        <input type="text" v-model="searchQuery" placeholder="サークル名、ペンネームで検索..." 
               class="w-full px-4 py-2 rounded shadow border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- サークル一覧 -->
      <div class="flex-1 overflow-y-auto bg-white shadow rounded">
        <div v-if="loading" class="p-4 text-center text-gray-500">データを読み込み中...</div>
        <div v-else-if="filteredCircles.length === 0" class="p-4 text-center text-gray-500">該当するサークルが見つかりません。</div>
        <ul v-else class="divide-y divide-gray-200">
          <li v-for="circle in filteredCircles" :key="circle.circle_id" class="p-4 hover:bg-gray-50 transition">
            <div class="flex items-start gap-4">
              <div class="flex-shrink-0 w-16 h-16 bg-gray-200 rounded overflow-hidden flex items-center justify-center">
                <img v-if="circle.circlecut" :src="circle.circlecut" alt="サークルカット" class="object-cover w-full h-full" loading="lazy">
                <span v-else class="text-xs text-gray-400">No Image</span>
              </div>
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <span class="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded">
                    {{ circle.space_sym }}-{{ circle.space_num }}
                  </span>
                  <h3 class="font-bold text-lg leading-tight">{{ circle.circle_name }}</h3>
                </div>
                <p class="text-sm text-gray-600 mb-1">{{ circle.penname }} <span class="text-xs text-gray-400">({{ circle.circle_kana }})</span></p>
                <div class="flex gap-2 text-xs">
                  <a v-if="circle.twitter_id" :href="'https://twitter.com/' + circle.twitter_id" target="_blank" class="text-blue-500 hover:underline">Twitter</a>
                  <a v-if="circle.pixiv_url" :href="circle.pixiv_url" target="_blank" class="text-blue-500 hover:underline">Pixiv</a>
                  <a v-if="circle.site_url" :href="circle.site_url" target="_blank" class="text-blue-500 hover:underline">Webサイト</a>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const circles = ref([]);
        const blocks = ref([]);
        const loading = ref(true);
        const searchQuery = ref('');
        const filterBlock = ref('');

        onMounted(async () => {
          try {
            const res = await fetch('data.json');
            const data = await res.json();
            circles.value = data.circles;
            blocks.value = data.sort_order;
          } catch (error) {
            console.error('Error fetching data:', error);
          } finally {
            loading.value = false;
          }
        });

        const filteredCircles = computed(() => {
          return circles.value.filter(circle => {
            const matchQuery = !searchQuery.value || 
              (circle.circle_name && circle.circle_name.toLowerCase().includes(searchQuery.value.toLowerCase())) ||
              (circle.penname && circle.penname.toLowerCase().includes(searchQuery.value.toLowerCase())) ||
              (circle.circle_kana && circle.circle_kana.includes(searchQuery.value));
            
            const matchBlock = !filterBlock.value || circle.space_sym === filterBlock.value;
            
            return matchQuery && matchBlock;
          });
        });

        return {
          circles,
          blocks,
          loading,
          searchQuery,
          filterBlock,
          filteredCircles
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
